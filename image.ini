[dev-workspace]
image=quay.io/toolbx-images/debian-toolbox:13
init=false
nvidia=false
pull=true
root=false
replace=false
start_now=false
additional_packages="build-essential cmake pkg-config git vim zsh curl wget ca-certificates"
additional_packages="file less man-db locales unzip xz-utils zip"
additional_packages="libssl-dev zlib1g-dev libffi-dev libreadline-dev libsqlite3-dev"
additional_packages="python3 python3-pip python3-venv"
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/docker;
